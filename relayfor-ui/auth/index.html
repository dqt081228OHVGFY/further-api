<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b57d0">
  <title>登录 · RelayFor</title>
  <link rel="icon" type="image/svg+xml" href="/relayfor-logo.svg">
  <link rel="stylesheet" href="/relayfor-assets/app.css">
  <link rel="stylesheet" href="/relayfor-assets/gateway-theme.css">
  <link rel="stylesheet" href="/relayfor-assets/material.css">
  <link rel="stylesheet" href="/relayfor-assets/auth-material.css">
  <script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/material-icons.js"></script>
  <script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/app.js"></script>
  <script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/site.js"></script>
  <script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/appearance.js"></script>
<script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/lunar-schedule.js"></script>
<script type="application/x-relayfor-legacy" data-relayfor-source-only="true" defer src="/relayfor-assets/activities.js"></script>
<link rel="stylesheet" href="/relayfor-assets/activities.css">
<link rel="stylesheet" href="/relayfor-assets/workspace-colors.css">
</head>
<body data-page="auth" class="auth-page auth-material-page">
  <div class="auth-shell">
    <header class="auth-header">
      <a class="auth-brand" href="/" aria-label="返回首页">
        <span class="rail-logo"><img src="/relayfor-logo.svg" width="40" height="40" alt=""></span>
        <span><strong data-site-name>RelayFor</strong><small data-site-subtitle>AI API 网关</small></span>
      </a>
      <a class="md-btn md-btn-text auth-home-link" href="/"><span class="material-symbol" aria-hidden="true">arrow_outward</span>返回首页</a>
    </header>
    <main class="auth-workspace">
      <section class="auth-story" aria-labelledby="auth-story-title">
        
        <h2 id="auth-story-title">账户登录</h2>
        
        <div class="auth-flow-illustration" aria-hidden="true">
          <svg class="auth-flow-lines" viewBox="0 0 480 270" fill="none"><path d="M79 83H175Q210 83 210 118V151Q210 184 244 184H326"/><path d="M142 217H195Q230 217 230 182V107Q230 72 267 72H398"/><circle cx="80" cy="83" r="6"/><circle cx="399" cy="72" r="6"/><circle cx="142" cy="217" r="6"/><circle cx="326" cy="184" r="6"/></svg>
          <span class="auth-flow-node auth-flow-node-code"><span class="material-symbol">code</span></span>
          <span class="auth-flow-node auth-flow-node-core"><span class="material-symbol">auto_awesome</span></span>
          <span class="auth-flow-node auth-flow-node-chat"><span class="material-symbol">chat_bubble</span></span>
          <span class="auth-flow-node auth-flow-node-bolt"><span class="material-symbol">bolt</span></span>
          
        </div>
        
      </section>
      <section class="auth-entry" aria-labelledby="auth-title">
        <div class="md-card auth-card">
          
          <h1 id="auth-title">登录</h1>
          <p id="auth-description"></p>
          <section class="site-announcement hidden" data-site-announcement aria-live="polite">
      <span class="site-announcement-icon"><span class="material-symbol" aria-hidden="true">campaign</span></span>
      <div><b data-site-announcement-title>站点公告</b><p data-site-announcement-content></p></div>
          </section>
      <div class="status-err hidden" id="auth-oauth-message" role="alert"></div>
      <div class="auth-provider-area">
        <button id="linuxdo-login" class="md-btn md-btn-outlined auth-submit auth-linuxdo-button" type="button" aria-describedby="linuxdo-login-hint"><img class="linuxdo-mark" src="/relayfor-assets/linuxdo-login.png" width="24" height="24" alt="" aria-hidden="true"><span>使用 Linux DO 登录</span><span class="material-symbol auth-provider-arrow" aria-hidden="true">arrow_forward</span></button>
        <p class="field-hint hidden" id="linuxdo-login-hint"></p>
      </div>
      <div class="auth-divider"><span>或使用账户登录</span></div>
      <form id="auth-form" method="post" action="/api/user/login">
        <div id="local-auth-fields">
          <div class="md-textfield">
            <input class="md-input" id="auth-username" name="username" autocomplete="username" placeholder=" " required>
            <label class="md-input-label" for="auth-username">用户名</label>
          </div>
          <div class="md-textfield auth-password-field">
            <input class="md-input" id="auth-password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
            <label class="md-input-label" for="auth-password">密码</label>
            <button id="auth-password-toggle" class="md-icon-button" type="button" aria-label="显示密码" aria-pressed="false"><span class="material-symbol" aria-hidden="true">visibility</span></button>
          </div>
        </div>
        <div class="md-textfield hidden" id="auth-registration-code-wrap">
          <input class="md-input" id="auth-registration-code" name="registration_code" type="password" autocomplete="one-time-code" placeholder=" ">
          <label class="md-input-label" for="auth-registration-code">注册码</label>
        </div>
        <p class="field-hint hidden" id="auth-registration-hint">需要注册码。</p>
        <p class="card-hint hidden" id="auth-local-closed">本地注册已关闭。</p>
        <button id="auth-submit" class="md-btn md-btn-filled auth-submit" type="submit">登录</button>
      </form>
      <div class="auth-links">
        <span data-auth-switch-hint>还没有账户？</span>
        <a id="auth-switch" class="md-btn md-btn-text" href="/auth/?mode=register">创建账户</a>
      </div>
      
        </div>
      </section>
    </main>
    <footer class="auth-page-footer"><span>© <span data-site-name>RelayFor</span></span><a href="/">返回首页<span class="material-symbol" aria-hidden="true">arrow_forward</span></a></footer>
  </div>
</body>
</html>

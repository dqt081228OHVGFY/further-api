name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Further UI typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Read service version
        run: |
          release_version="$(tr -d '\r\n' < ../VERSION)"
          [[ "$release_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "VITE_REACT_APP_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Verify animation styles
        run: node --test scripts/workspace-motion-css.test.mjs scripts/home-motion.test.mjs scripts/native-features-css.test.mjs
      - name: Build all Further UI pages and resources
        run: bun run build
      - name: Save frontend for the Go embed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: further-ui-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend vet, build, and test
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Restore the actual frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: further-ui-dist
          path: web/dist/
      - name: Vet root module
        run: go vet ./...
      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...
      - name: Build and verify the service version
        run: |
          release_version="$(tr -d '\r\n' < VERSION)"
          [[ "$release_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || exit 1
          go build -trimpath -ldflags "-s -w -X github.com/dqt081228OHVGFY/further-api/common.Version=$release_version" -o "$RUNNER_TEMP/further-api" .
          test "$("$RUNNER_TEMP/further-api" --version)" = "$release_version"
      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...
      - name: Test root module including the embedded gateway
        run: go test -timeout 20m ./...
      - name: Test relaykit independently
        working-directory: relaykit
        run: go test -timeout 20m ./...

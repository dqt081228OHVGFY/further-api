name: Build further-api (Linux, macOS, Windows)

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Build reason; branch builds only save artifacts'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ''
          - platform: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ''
          - platform: macos
            runner: macos-latest
            goos: darwin
            goarch: native
            suffix: ''
          - platform: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: '.exe'
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read the checked-in service version
        run: |
          release_version="$(tr -d '\r\n' < VERSION)"
          [[ "$release_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || exit 1
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$release_version" ]]; then
            echo '::error::The release tag must match VERSION'
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "VITE_REACT_APP_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Build all frontend pages before Go embeds them
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:check
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Build the versioned gateway
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          target_arch="$TARGET_ARCH"
          if [[ "$target_arch" == native ]]; then target_arch="$(go env GOHOSTARCH)"; fi
          binary_name="further-api-${TARGET_OS}-${target_arch}-${RELEASE_VERSION}${BINARY_SUFFIX}"
          mkdir -p dist
          go mod download
          GOOS="$TARGET_OS" GOARCH="$target_arch" go build -trimpath -ldflags "-s -w -X github.com/dqt081228OHVGFY/further-api/common.Version=$RELEASE_VERSION" -o "dist/$binary_name" .
          if [[ "$TARGET_OS" == "$(go env GOHOSTOS)" && "$target_arch" == "$(go env GOHOSTARCH)" ]]; then
            test "$("./dist/$binary_name" --version)" = "$RELEASE_VERSION"
          fi
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$binary_name" > "$binary_name.sha256")
          else
            (cd dist && shasum -a 256 "$binary_name" > "$binary_name.sha256")
          fi
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md dist/
      - name: Save built binaries and licensing notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: further-api-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the explicitly tagged GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: further-api-*
          merge-multiple: true
          path: release-files/
      - name: Publish the binary assets and checksums
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-files/*
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

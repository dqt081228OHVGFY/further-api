<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005ac1">
  <title>登录 · RelayFor</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
  <script defer src="/site.js"></script>
</head>
<body data-page="auth" class="auth-page">
  <div class="auth-shell">
    <header class="auth-header">
      <a class="auth-brand" href="/">
        <span class="rail-logo"><span class="material-symbol" aria-hidden="true">hub</span></span>
		<span><strong>RelayFor</strong><small data-site-subtitle>AI API 网关</small></span>
      </a>
    </header>

    <section class="site-announcement hidden" data-site-announcement aria-live="polite">
      <span class="site-announcement-icon"><span class="material-symbol" aria-hidden="true">campaign</span></span>
      <div><b data-site-announcement-title>站点公告</b><p data-site-announcement-content></p></div>
    </section>

    <main class="md-card auth-card">
      <h1 id="auth-title">登录</h1>
      <p class="hidden" id="auth-description"></p>
      <div class="status-err hidden" id="auth-oauth-message"></div>
      <button id="linuxdo-login" class="md-btn md-btn-outlined auth-submit" type="button">使用 LinuxDO Connect 登录</button>
      <div class="auth-divider"><span>或使用本地账户</span></div>
      <form id="auth-form">
        <div id="local-auth-fields">
          <div class="md-textfield">
            <input class="md-input" id="auth-username" name="username" autocomplete="username" placeholder=" " required>
            <label class="md-input-label" for="auth-username">用户名</label>
          </div>
          <div class="md-textfield">
            <input class="md-input" id="auth-password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
            <label class="md-input-label" for="auth-password">密码</label>
          </div>
        </div>
        <div class="md-textfield hidden" id="auth-registration-code-wrap">
          <input class="md-input" id="auth-registration-code" name="registration_code" type="password" autocomplete="one-time-code" placeholder=" ">
          <label class="md-input-label" for="auth-registration-code">注册码</label>
        </div>
        <p class="field-hint hidden" id="auth-registration-hint">需要注册码。</p>
        <p class="card-hint hidden" id="auth-local-closed">本地注册已关闭。</p>
        <button id="auth-submit" class="md-btn md-btn-filled auth-submit" type="submit">登录</button>
      </form>
      <div class="auth-links">
        <a id="auth-switch" class="md-btn md-btn-text" href="/auth/?mode=register">创建账户</a>
        <a class="md-btn md-btn-text" href="/">返回首页</a>
      </div>
    </main>
  </div>
</body>
</html>
